<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StockWatch inventory attention dashboard" />
    <title>StockWatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-lockup" aria-label="StockWatch by FreshRoute">
        <svg
          class="brand-mark"
          viewBox="0 0 44 44"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="1" y="1" width="42" height="42" rx="11"></rect>
          <path
            class="brand-route"
            d="M11 29c7 0 7-14 14-14h8"
          ></path>
          <path class="brand-arrow" d="m29 10 6 5-6 5"></path>
          <path
            class="brand-leaf"
            d="M13 25c-4-6 0-11 7-11 0 7-3 11-7 11Z"
          ></path>
        </svg>
        <span class="brand-copy">
          <strong>StockWatch</strong>
          <span>FreshRoute dairy operations</span>
        </span>
      </div>
      <p class="dock-meta">Cold-chain review · Receiving bay 01</p>
      <p class="demo-date">
        <span>Demo inventory date</span>
        <time datetime="2026-07-22">July 22, 2026</time>
      </p>
    </header>

    <main
      class="dashboard"
      id="app"
      aria-busy="true"
    ></main>

    <script type="module" src="script.js"></script>
  </body>
</html>
